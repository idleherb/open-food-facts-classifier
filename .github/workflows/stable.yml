name: stable

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag (e.g. v2026.5.1-abc1234) to build and publish"
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: stable
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build-push:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag and short SHA
        id: meta
        run: |
          tag="${GITHUB_REF##refs/tags/}"
          version="${tag#v}"
          sha7=$(git rev-parse --short=7 HEAD)
          date=$(git log -1 --date=format:%Y.%-m.%-d --format=%cd HEAD)
          {
            echo "version=$version"
            echo "sha7=$sha7"
            echo "date=$date"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing classifier $version (sha $sha7, commit date $date)"

      - name: Set up buildx
        uses: docker/setup-buildx-action@v3

      - name: Build amd64 image locally for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: open-food-facts-classifier:smoke
          build-args: |
            VORRAT_BUILD_CHANNEL=stable
            VORRAT_BUILD_SHA=${{ steps.meta.outputs.sha7 }}
            VORRAT_BUILD_DATE=${{ steps.meta.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Smoke test — boot container, hit /healthz, expect 503 on /classify
        run: |
          set -euo pipefail
          docker run -d --name classifier-smoke -p 8001:8001 open-food-facts-classifier:smoke
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8001/healthz > /dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          healthz=$(curl -fsS http://localhost:8001/healthz)
          echo "healthz: $healthz"
          echo "$healthz" | grep -q '"ok":true'
          echo "$healthz" | grep -q '"channel":"stable"'
          echo "$healthz" | grep -q "\"commit\":\"${{ steps.meta.outputs.sha7 }}\""
          echo "$healthz" | grep -q '"model_loaded":false'
          status=$(curl -s -o /tmp/body.json -w "%{http_code}" -X POST \
            -H content-type:application/json \
            -d '{"name":"Anything"}' \
            http://localhost:8001/classify)
          [ "$status" = "503" ]
          grep -q "model not loaded" /tmp/body.json

      - name: Show container logs on smoke failure
        if: failure()
        run: docker logs classifier-smoke || true

      - name: Stop smoke container
        if: always()
        run: docker rm -f classifier-smoke || true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/open-food-facts-classifier:${{ steps.meta.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/open-food-facts-classifier:stable-latest
          build-args: |
            VORRAT_BUILD_CHANNEL=stable
            VORRAT_BUILD_SHA=${{ steps.meta.outputs.sha7 }}
            VORRAT_BUILD_DATE=${{ steps.meta.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
