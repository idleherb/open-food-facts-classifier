[project]
name = "open-food-facts-classifier"
version = "0.0.1"
description = "Local LLM-backed product-category classifier for the Vorrat household-pantry app. Stage 2 of ADR-0031 (vorrat repo) — runs Qwen 2.5-7B-Instruct via llama-cpp-python and returns one of 16 stable category buckets, GBNF-grammar-constrained so the model literally cannot return anything else."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "deferred" }
authors = [{ name = "idleherb" }]

dependencies = [
    "fastapi>=0.118",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "llama-cpp-python>=0.3.21",
    "huggingface-hub>=0.28",
    "pyyaml>=6.0",
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.13",
    "ty>=0.0.1a16",
    "asgi-lifespan>=2.1",
    "diff-cover>=10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/off_classifier"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "C4", "SIM", "RUF", "PL",
]
ignore = ["PLR0913"]  # too-many-arguments — FastAPI route signatures need them

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]  # magic numbers in tests are fine

[tool.pytest.ini_options]
addopts = """
    --strict-markers
    --strict-config
    --cov=src/off_classifier
    --cov-branch
    --cov-report=term-missing
    --cov-report=xml
    --cov-fail-under=90
"""
asyncio_mode = "auto"
testpaths = ["tests"]
log_level = "WARNING"

[tool.coverage.run]
branch = true
source = ["src/off_classifier"]
omit = ["src/off_classifier/inference/llama_runner.py"]
# llama_runner is the thin wrapper around llama_cpp.Llama; testing it
# requires a real model download. Behaviour is verified via integration
# smoke tests with OFF_CLASSIFIER_MODEL_PATH pointing at a local GGUF.

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
